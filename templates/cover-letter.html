<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$</title>
  <style>
    @page {
      size: A4;
      margin: 20mm 22mm 20mm 22mm;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 9.5pt;
      color: #111;
      background: white;
    }

    /* ── Header (identical to cv-conservative) ── */
    header {
      padding-bottom: 14px;
      border-bottom: 2px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }
    .header-text { flex: 1; }
    .header-name {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 22pt;
      font-weight: 400;
      letter-spacing: 0.2px;
      line-height: 1.1;
      color: #111;
    }
    .header-subtitle {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #555;
      margin-top: 5px;
    }
    .header-contact {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      color: #444;
      margin-top: 8px;
      line-height: 1.5;
    }
    .header-contact a { color: #222; text-decoration: none; }
    .portrait {
      width: 3.0cm;
      height: 3.6cm;
      object-fit: cover;
      object-position: center 10%;
      border: 1px solid #ccc;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ── Letter body ── */
    .body-content {
      padding-top: 16px;
    }

    /* Subject line — styled like a CV section heading */
    h2 {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #222;
      border-bottom: 1px solid #aaa;
      padding-bottom: 3px;
      margin-top: 14px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    /* Regular paragraphs */
    .body-content > p {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 9.5pt;
      line-height: 1.55;
      color: #111;
      margin-bottom: 8px;
    }

    /* Standalone bold paragraphs = section separators within the letter */
    .body-content > p > strong:only-child {
      font-size: 8pt;
      font-weight: 700;
      color: #222;
      display: block;
      margin-top: 6px;
      margin-bottom: -2px;
    }

    /* Closing separator and Anlagen line */
    hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 10px 0 8px;
    }
    .body-content > p > em {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      color: #666;
      font-style: normal;
    }

    a { color: #111; }
    em { font-style: italic; }
    strong { font-weight: 700; }
  </style>
</head>
<body>

<header>
  <div class="header-text">
$if(subtitle)$    <div class="header-subtitle">$subtitle$</div>
$endif$
$if(contact)$    <div class="header-contact">$contact$</div>
$endif$
  </div>
</header>

<div class="body-content">
$body$
</div>

</body>
</html>
