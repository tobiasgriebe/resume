<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$</title>
  <style>
    /* ── Page setup ── */
    @page {
      size: A4;
      margin: 20mm 22mm 20mm 22mm;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 9.5pt;
      color: #111;
      background: white;
    }

    /* ── Header ── */
    header {
      padding-bottom: 14px;
      border-bottom: 2px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .header-text {
      flex: 1;
    }

    .header-name {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 22pt;
      font-weight: 400;
      letter-spacing: 0.2px;
      line-height: 1.1;
      color: #111;
    }

    .header-subtitle {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #555;
      margin-top: 5px;
    }

    .header-contact {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      color: #444;
      margin-top: 8px;
      line-height: 1.5;
    }

    .header-contact a { color: #222; text-decoration: none; }

    .portrait {
      width: 3.0cm;
      height: 3.6cm;
      object-fit: cover;
      object-position: center 10%;
      border: 1px solid #ccc;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ── Body content ── */
    .body-content {
      padding-top: 16px;
    }

    /* ── Section headings ── */
    h2 {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #222;
      border-bottom: 1px solid #aaa;
      padding-bottom: 3px;
      margin-top: 18px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    /* ── Definition lists ── */
    dl { margin: 0; }

    dt {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      color: #666;
      float: left;
      clear: left;
      width: 128px;
      padding-right: 10px;
      padding-top: 2px;
      line-height: 1.45;
      page-break-after: avoid;
      break-after: avoid;
    }

    dd {
      margin-left: 140px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    dd p {
      font-size: 9pt;
      line-height: 1.5;
      color: #111;
      margin-bottom: 3px;
    }

    dd p:first-child strong {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 10pt;
      color: #000;
    }

    dd ul {
      margin: 4px 0 0;
      padding-left: 15px;
    }

    dd li {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8.5pt;
      line-height: 1.5;
      color: #222;
      margin-bottom: 1px;
    }

    /* ── Skill blocks ── */
    .body-content > p {
      font-size: 9pt;
      line-height: 1.5;
      color: #222;
      margin-bottom: 7px;
    }

    .body-content > p > strong:first-child {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      display: block;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    /* ── Bullet lists ── */
    .body-content > ul {
      padding-left: 16px;
      margin-bottom: 8px;
    }

    .body-content > ul li {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 9pt;
      line-height: 1.5;
      color: #222;
      margin-bottom: 2px;
    }

    /* ── Subsection headers within experience entries ── */
    dd h4 {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 7pt;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 1px;
      page-break-after: avoid;
      break-after: avoid;
    }
    dd h4:first-child {
      margin-top: 0;
    }

    /* ── Links ── */
    a { color: #111; }

    /* ── Misc ── */
    em { font-style: italic; }
    strong { font-weight: 700; }

    /* ── Page break helpers ── */
    h2 { page-break-after: avoid; break-after: avoid; }

$if(compact)$
    /* ── Compact overrides (onepager) ── */
    @page { margin: 14mm 18mm 14mm 18mm; }
    body { font-size: 8.5pt; }
    header { padding-bottom: 10px; }
    .header-name { font-size: 18pt; }
    .header-subtitle { font-size: 7.5pt; margin-top: 3px; }
    .header-contact { font-size: 7.5pt; margin-top: 6px; line-height: 1.5; }
    .portrait { width: 2.4cm; height: 2.9cm; }
    .body-content { padding-top: 12px; }
    h2 { font-size: 7.5pt; margin-top: 12px; margin-bottom: 7px; }
    dt { font-size: 7.5pt; width: 112px; }
    dd { margin-left: 122px; margin-bottom: 8px; }
    dd p { font-size: 8.5pt; }
    dd p:first-child strong { font-size: 9pt; }
    dd li { font-size: 8pt; }
    dd ul { margin-top: 2px; }
    .body-content > p { font-size: 8.5pt; margin-bottom: 5px; }
    .body-content > ul li { font-size: 8.5pt; }
$endif$
  </style>
</head>
<body>

<header>
  <div class="header-text">
    <div class="header-name">$title$</div>
$if(subtitle)$    <div class="header-subtitle">$subtitle$</div>
$endif$
$if(contact)$    <div class="header-contact">$contact$</div>
$endif$
  </div>
$if(photo)$  <img src="$photo$" class="portrait" alt="$title$">
$endif$
</header>

<div class="body-content">
$body$
</div>

</body>
</html>
