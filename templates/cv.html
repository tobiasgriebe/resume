<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$</title>
  <style>
    /* ── Page setup ── */
    @page {
      size: A4;
      margin: 16mm 20mm 16mm 20mm;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 9pt;
      color: #1a1a1a;
      background: white;
    }

    /* ── Header (first page) ── */
    header {
      background: #18293a;
      color: white;
      padding: 26px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .header-name {
      font-size: 22pt;
      font-weight: 400;
      letter-spacing: 0.4px;
      line-height: 1.1;
    }

    .header-subtitle {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 7.5pt;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: #90b4cc;
      margin-top: 6px;
    }

    .header-contact {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 7.5pt;
      color: #b8cdd8;
      margin-top: 9px;
      line-height: 1.5;
    }

    .header-contact a { color: #90b4cc; text-decoration: none; }

    .portrait {
      width: 3.6cm;
      height: 3.6cm;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 10%;
      border: 2px solid rgba(255,255,255,0.22);
      flex-shrink: 0;
    }

    /* ── Body content ── */
    .body-content {
      padding-top: 18px;
    }

    /* ── Section headings (## in markdown) ── */
    h2 {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 7pt;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #18293a;
      border-bottom: 1.5px solid #18293a;
      padding-bottom: 4px;
      margin-top: 20px;
      margin-bottom: 11px;
      font-weight: 700;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── Definition lists — experience/education entries ── */
    dl { margin: 0; }

    dt {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      color: #888;
      float: left;
      clear: left;
      width: 128px;
      padding-right: 10px;
      padding-top: 2px;
      line-height: 1.45;
      page-break-after: avoid;
      break-after: avoid;
    }

    dd {
      margin-left: 140px;
      margin-bottom: 14px;
      overflow: hidden; /* contain floated dt */
    }

    dd p {
      font-size: 8.5pt;
      line-height: 1.5;
      color: #222;
      margin-bottom: 3px;
    }

    dd p:first-child strong {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 9.5pt;
      color: #111;
    }

    dd ul {
      margin: 4px 0 0;
      padding-left: 15px;
    }

    dd li {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      line-height: 1.5;
      color: #333;
      margin-bottom: 1px;
    }

    /* ── Skill blocks (bold heading + paragraph) ── */
    .body-content > p { /* top-level paragraphs (skills, personal) */
      font-size: 8.5pt;
      line-height: 1.5;
      color: #333;
      margin-bottom: 7px;
    }

    .body-content > p > strong:first-child {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      display: block;
      color: #18293a;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 2px;
    }

    /* ── Bullet lists (certifications, skills) ── */
    .body-content > ul {
      padding-left: 16px;
      margin-bottom: 8px;
    }

    .body-content > ul li {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8.5pt;
      line-height: 1.5;
      color: #333;
      margin-bottom: 2px;
    }

    /* ── Executive summary ── */
    .executive-summary {
      border-left: 3px solid rgba(144, 180, 204, 0.75);
      padding: 10px 16px;
      margin: 0 0 2px;
      background: rgba(24, 41, 58, 0.03);
    }
    .executive-summary p {
      font-style: italic;
      font-size: 9pt;
      line-height: 1.5;
      color: #222;
      margin: 0;
    }

    /* ── Core competencies grid ── */
    .core-competencies-2col,
    .core-competencies-3col {
      margin-bottom: 4px;
    }
    .core-competencies-2col { column-count: 2; column-gap: 22px; }
    .core-competencies-3col { column-count: 3; column-gap: 16px; }

    .core-competencies-2col p,
    .core-competencies-3col p {
      break-inside: avoid;
      page-break-inside: avoid;
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      line-height: 1.5;
      color: #333;
      margin-bottom: 10px;
    }
    .core-competencies-2col p strong:first-child,
    .core-competencies-3col p strong:first-child {
      font-size: 7pt;
      display: block;
      color: #18293a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      font-weight: 700;
    }

    /* ── Subsection headers within experience entries ── */
    dd p > strong:only-child {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 6.5pt;
      display: block;
      color: #18293a;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 1px;
    }
    dd p:has(> strong:only-child) {
      margin-top: 14px;
    }
    dd p:first-child:has(> strong:only-child) {
      margin-top: 0;
    }

    /* ── Earlier positions — compact DL, no description text ── */
    .earlier-positions dd {
      margin-bottom: 5px;
    }
    .earlier-positions dd p {
      font-size: 8.5pt;
      margin-bottom: 0;
    }

    /* ── Executive-level leadership competencies (2-col bullet list + page break) ── */
    .executive-competencies {
      column-count: 2;
      column-gap: 22px;
      margin-bottom: 0;
      break-after: page;
      page-break-after: always;
    }
    .executive-competencies ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .executive-competencies li {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 8pt;
      line-height: 1.5;
      color: #222;
      margin-bottom: 5px;
      padding-left: 13px;
      text-indent: -13px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .executive-competencies li::before {
      content: "▸ ";
      color: #18293a;
      font-size: 7pt;
    }

    /* ── Links ── */
    a { color: #18293a; }

    /* ── Misc ── */
    em { font-style: italic; }
    strong { font-weight: 700; }

    /* ── Page break helpers ── */
    h2 { page-break-after: avoid; break-after: avoid; }

$if(compact)$
    /* ── Compact overrides (onepager) ── */
    @page { margin: 12mm 16mm 12mm 16mm; }
    body { font-size: 8pt; }
    header { padding: 18px 22px; }
    .header-name { font-size: 18pt; }
    .header-subtitle { font-size: 7pt; margin-top: 4px; }
    .header-contact { font-size: 7pt; margin-top: 6px; line-height: 1.5; }
    .portrait { width: 2.8cm; height: 2.8cm; }
    .body-content { padding-top: 12px; }
    h2 { font-size: 6.5pt; margin-top: 14px; margin-bottom: 8px; }
    dt { font-size: 7.5pt; width: 112px; }
    dd { margin-left: 122px; margin-bottom: 9px; }
    dd p { font-size: 8pt; }
    dd p:first-child strong { font-size: 8.5pt; }
    dd li { font-size: 7.5pt; }
    dd ul { margin-top: 3px; }
    .body-content > p { font-size: 8pt; margin-bottom: 5px; }
    .body-content > ul li { font-size: 8pt; }
    .executive-summary p { font-size: 8.5pt; line-height: 1.5; }
    .core-competencies-2col p, .core-competencies-3col p { font-size: 7.5pt; margin-bottom: 7px; }
$endif$
  </style>
</head>
<body>

<header>
  <div class="header-text">
    <div class="header-name">$title$</div>
$if(subtitle)$    <div class="header-subtitle">$subtitle$</div>
$endif$
$if(contact)$    <div class="header-contact">$contact$</div>
$endif$
  </div>
$if(photo)$  <img src="$photo$" class="portrait" alt="$title$">
$endif$
</header>

<div class="body-content">
$body$
</div>

</body>
</html>
